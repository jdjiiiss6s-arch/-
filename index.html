<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الدرجات عبر Google Sheets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

    <header class="bg-indigo-600 text-white shadow-md p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">🎓 منصة النتائج (جداول جوجل)</h1>
            <div class="space-x-2 space-x-reverse">
                <button onclick="switchTab('login')" class="bg-indigo-700 px-3 py-1.5 rounded-lg text-sm">دخول الطالب</button>
                <button onclick="switchTab('register')" class="bg-emerald-600 px-3 py-1.5 rounded-lg text-sm">تسجيل طالب جديد</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 flex-grow flex items-center justify-center">
        
        <!-- شاشة تسجيل دخول الطالب -->
        <div id="tab-login" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">استعلام عن النتيجة</h2>
            <p class="text-gray-500 text-sm mb-6">أدخل الرمز السري الخاص بك</p>
            <input type="password" id="login-pin" placeholder="الرمز السري" class="w-full px-4 py-3 border rounded-xl text-center mb-4 focus:ring-2 focus:ring-indigo-500">
            <button onclick="studentLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition">عرض النتيجة</button>
        </div>

        <!-- شاشة تسجيل طالب جديد -->
        <div id="tab-register" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-2 text-center">تسجيل حساب جديد</h2>
            <p class="text-gray-500 text-sm mb-6 text-center">أنشئ اسمك ورمزك السري</p>
            <div class="space-y-4">
                <input type="text" id="reg-name" placeholder="اسم الطالب الثلاثي" class="w-full px-4 py-3 border rounded-xl">
                <input type="password" id="reg-pin" placeholder="الرمز السري الخاص بك" class="w-full px-4 py-3 border rounded-xl">
                <button onclick="studentRegister()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition">إرسال وطلب التسجيل</button>
            </div>
        </div>

        <!-- شاشة عرض النتيجة -->
        <div id="tab-report" class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-lg hidden text-center">
            <h3 id="rep-name" class="text-2xl font-bold text-gray-800 mb-2"></h3>
            <p class="text-gray-600 mb-4">الرمز السري: <span id="rep-pin-display" class="font-mono font-bold"></span></p>
            <div class="bg-indigo-50 p-4 rounded-xl text-indigo-900 font-semibold mb-4">
                ملاحظة: درجاتك يتم تحديثها وإضافتها مباشرة من قبل إدارة المدرسة عبر جدول البيانات.
            </div>
            <button onclick="switchTab('login')" class="bg-gray-200 px-4 py-2 rounded-lg text-sm">رجوع</button>
        </div>

    </main>

    <script>
        // ضع رابط SheetDB الخاص بك هنا بين العلامتين
        const SHEET_API_URL = "https://sheetdb.io/api/v1/YOUR_API_ID_HERE";

        function switchTab(tab) {
            document.getElementById('tab-login').classList.add('hidden');
            document.getElementById('tab-register').classList.add('hidden');
            document.getElementById('tab-report').classList.add('hidden');
            document.getElementById('tab-' + tab).classList.remove('hidden');
        }

        // تسجيل طالب جديد وإضافته لجدول جوجل تلقائياً
        async function studentRegister() {
            let name = document.getElementById('reg-name').value.trim();
            let pin = document.getElementById('reg-pin').value.trim();
            if(!name || !pin) { alert("يرجى ملء كافة الحقول!"); return; }

            let studentData = {
                data: [
                    { "name": name, "pin": pin, "grades": "قيد التحديد" }
                ]
            };

            try {
                let response = await fetch(SHEET_API_URL, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify(studentData)
                });
                
                if(response.ok) {
                    alert("تم تسجيل حسابك بنجاح في جدول البيانات!");
                    switchTab('login');
                } else {
                    alert("حدث خطأ أثناء التسجيل.");
                }
            } catch (error) {
                alert("تعذر الاتصال بقاعدة البيانات.");
            }
        }

        // استعلام الطالب عن حسابه
        async function studentLogin() {
            let pin = document.getElementById('login-pin').value.trim();
            if(!pin) { alert("أدخل الرمز السري"); return; }

            try {
                let response = await fetch(`${SHEET_API_URL}/search?pin=${pin}`);
                let data = await response.json();

                if(data.length === 0) {
                    alert("الرمز السري غير موجود أو لم يتم تسجيله بعد!");
                    return;
                }

                let student = data[0];
                document.getElementById('rep-name').innerText = student.name;
                document.getElementById('rep-pin-display').innerText = student.pin;
                switchTab('report');

            } catch (error) {
                alert("حدث خطأ أثناء البحث.");
            }
        }
    </script>
</body>
</html>
